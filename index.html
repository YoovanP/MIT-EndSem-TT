<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIT Mid Term Timetable — September 2026</title>
  <meta name="description" content="Manipal Institute of Technology V Semester B.Tech Mid Term Examination Timetable for September 2026. Filter by branch to view your exam schedule." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:    #0a0a0a;
      --bg-secondary:  #111111;
      --bg-tertiary:   #1a1a1a;
      --bg-hover:      #222222;
      --bg-card:       #141414;
      --border:        rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.15);
      --text-primary:  #f0f0f0;
      --text-secondary:#888;
      --text-muted:    #444;
      --accent-dim:    rgba(232,232,232,0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow: 0 12px 40px rgba(0,0,0,0.7);
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.5);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 40% at 50% -5%, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    main { position: relative; z-index: 1; }

    /* ── Header ── */
    header {
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, transparent 100%);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-dim);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      padding: 4px 14px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .header-badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    h1 {
      font-size: clamp(1.5rem, 3.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .subtitle strong { color: var(--text-primary); font-weight: 500; }

    /* ── App Shell ── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width, 268px) 1fr;
      min-height: calc(100vh - 170px);
      transition: grid-template-columns 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-shell.sidebar-collapsed {
      --sidebar-width: 60px;
    }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 1.25rem 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: padding 0.3s ease;
      overflow-x: hidden;
    }

    .sidebar-collapsed .sidebar {
      padding: 1.25rem 0.5rem;
      align-items: center;
    }

    .sidebar-toggle {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      align-self: flex-end;
    }
    .sidebar-toggle svg { flex-shrink: 0; transition: transform 0.2s ease; }
    .sidebar-toggle-text,
    .sidebar-toggle-hint { display: none; }
    .sidebar-toggle:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .sidebar-collapsed .sidebar-toggle {
      align-self: center;
    }

    .sidebar-collapsed .sidebar-label,
    .sidebar-collapsed .branch-search,
    .sidebar-collapsed .branch-actions,
    .sidebar-collapsed .bname,
    .sidebar-collapsed .bcode,
    .sidebar-collapsed .bcount,
    .sidebar-collapsed .branch-list {
      display: none;
    }

    .sidebar-collapsed .branch-item {
      padding: 10px;
      justify-content: center;
    }
    .sidebar-collapsed .binfo {
      display: flex;
      justify-content: center;
    }

    .sidebar-label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 4px;
      margin-bottom: 0.7rem;
    }

    .branch-search {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      padding: 7px 11px;
      outline: none;
      margin-bottom: 0.6rem;
      transition: border-color 0.18s;
    }
    .branch-search:focus { border-color: var(--border-strong); }
    .branch-search::placeholder { color: var(--text-muted); }

    .branch-actions {
      display: flex;
      gap: 5px;
      margin-bottom: 0.75rem;
    }

    .btn-sm {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-strong); }

    .branch-list { display: flex; flex-direction: column; gap: 2px; flex: 1; }

    .branch-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      user-select: none;
    }
    .branch-item:hover { background: var(--bg-hover); border-color: var(--border); }
    .branch-item.selected { background: var(--accent-dim); border-color: var(--border-strong); }

    .bcheck {
      width: 14px; height: 14px;
      border: 1.5px solid var(--border-strong);
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .branch-item.selected .bcheck { background: var(--text-primary); border-color: var(--text-primary); }
    .bcheck svg { display: none; }
    .branch-item.selected .bcheck svg { display: block; }

    .binfo { flex: 1; min-width: 0; }
    .bcode { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; color: var(--text-primary); }
    .bname { font-size: 10.5px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bcount { font-size: 9.5px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); background: var(--bg-tertiary); border-radius: 100px; padding: 1px 6px; flex-shrink: 0; }

    /* ── Content ── */
    .content { padding: 1.75rem 1.75rem 3rem; min-width: 0; }

    /* ── Banners ── */
    .banner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .sce-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      animation: panelIn 0.22s ease;
      text-decoration: none;
      transition: border-color 0.18s, background 0.18s;
      margin-bottom: 0; /* Handled by banner-grid */
    }
    .sce-banner:hover {
      border-color: rgba(255,255,255,0.3);
      background: var(--bg-tertiary);
    }
    .sce-banner-left { display: flex; align-items: center; gap: 12px; }
    .sce-banner-icon {
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      background: var(--accent-dim);
      border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sce-banner-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .sce-banner-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .sce-banner-arrow {
      color: var(--text-muted);
      transition: color 0.15s, transform 0.15s;
      flex-shrink: 0;
    }
    .sce-banner:hover .sce-banner-arrow { color: var(--text-secondary); transform: translateX(3px); }

    /* ── Calendar Shell ── */
    .cal-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .cal-month-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .cal-legend {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .cal-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 10px; height: 10px;
      border-radius: 3px;
    }

    .legend-swatch.exam { background: var(--text-primary); opacity: 0.9; }
    .legend-swatch.selected-exam { background: var(--text-primary); opacity: 0.9; outline: 2px solid rgba(255,255,255,0.6); outline-offset: 1px; }

    /* Calendar scroller */
    .cal-scroll-wrap {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 8px; /* space for scrollbar */
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    
    .cal-inner {
      min-width: 680px; /* guarantees nice sizing even on small devices */
    }

    /* Day-of-week header row */
    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 6px 0;
    }

    /* Calendar grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    /* Individual day cell */
    .cal-cell {
      aspect-ratio: 1 / 1.12;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      padding: 8px 8px 6px;
      position: relative;
      transition: all 0.18s ease;
      min-height: 72px;
      background: var(--bg-card);
    }

    /* Empty filler cells around the September 2026 calendar */
    .cal-cell.filler {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }

    /* Regular non-exam day */
    .cal-cell.regular {
      border-color: var(--border);
      opacity: 0.45;
    }

    /* Exam day */
    .cal-cell.exam-day {
      border-color: var(--border-strong);
      cursor: pointer;
      opacity: 1;
    }
    .cal-cell.exam-day:hover {
      border-color: rgba(255,255,255,0.3);
      background: var(--bg-tertiary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* Exam day where active filter has no match — dim like a regular day */
    .cal-cell.exam-day.no-match {
      opacity: 0.3;
      cursor: default;
      border-color: var(--border);
    }
    .cal-cell.exam-day.no-match:hover {
      transform: none;
      box-shadow: none;
      background: var(--bg-card);
      border-color: var(--border);
    }

    /* Exam day with a selected-branch exam */
    .cal-cell.has-selected {
      border-color: rgba(255,255,255,0.35);
      background: #1c1c1c;
    }
    .cal-cell.has-selected:hover {
      border-color: rgba(255,255,255,0.5);
    }

    /* Active (clicked) exam day */
    .cal-cell.active {
      border-color: var(--text-primary) !important;
      background: #1e1e1e !important;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.1), var(--shadow-sm);
      transform: none !important;
    }

    /* Weekend tint */
    .cal-cell.weekend:not(.filler) .cal-day-num { color: var(--text-secondary); }

    .cal-day-num {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 5px;
    }

    .cal-cell.regular .cal-day-num { color: var(--text-muted); }

    /* Answer Script View / Event days */
    .cal-cell.event-day {
      border-style: dashed;
      border-color: rgba(255,255,255,0.22);
      background: #161616;
      opacity: 1;
      cursor: default;
    }
    .cal-cell.event-day .cal-day-num { color: var(--text-primary); }
    .cal-event-label {
      font-size: 9px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      line-height: 1.35;
      margin-top: auto;
      padding-top: 4px;
      letter-spacing: 0.01em;
    }
    .cal-event-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.07);
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 4px;
      padding: 2px 6px;
      margin-top: 4px;
      width: fit-content;
    }

    /* Exam dot indicators */
    .cal-dot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: auto;
    }

    .cal-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .cal-dot.selected { background: var(--text-primary); }

    /* Exam count label (shown when no branch selected) */
    .cal-count-label {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .cal-cell.exam-day .cal-count-label { color: var(--text-secondary); }
    .cal-cell.has-selected .cal-count-label { color: rgba(255,255,255,0.6); }

    /* Exam preview chip inside cell */
    .cal-chip {
      font-size: 9px;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      padding: 2px 4px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .cal-cell.has-selected .cal-chip {
      background: rgba(255,255,255,0.1);
      color: var(--text-primary);
    }

    /* ── Detail Panel ── */
    .detail-panel {
      margin-top: 1.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      overflow: hidden;
      animation: panelIn 0.22s ease;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-top {
      padding: 1.4rem 1.6rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .detail-date-big {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .detail-sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 9px;
      color: var(--text-secondary);
    }

    .detail-close {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 11px;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .detail-close:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-strong); }

    .detail-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 8px;
      padding: 1.25rem 1.6rem 1.6rem;
    }

    .dcard {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      transition: border-color 0.15s, background 0.15s;
    }
    .dcard:hover { border-color: var(--border-strong); background: var(--bg-tertiary); }

    .dcard-branch {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .dcard-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .dcard-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; max-height: unset; border-right: none; border-bottom: 1px solid var(--border); padding: 1rem; }
      .sidebar-collapsed .sidebar { padding: 0.5rem 1rem; }
      .sidebar-toggle {
        align-self: stretch;
        justify-content: flex-start;
        gap: 10px;
        margin-bottom: 1rem;
        padding: 10px 12px;
        border-color: var(--border-strong);
        background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      }
      .sidebar-toggle-text {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .sidebar-toggle-hint {
        display: block;
        margin-left: auto;
        font-size: 11px;
        color: var(--text-secondary);
      }
      .sidebar-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
      .sidebar-collapsed .sidebar-toggle { margin-bottom: 0; background: transparent; border-color: transparent; border-radius: 0; }
      .sidebar-collapsed .sidebar-toggle:hover { background: var(--bg-hover); border-color: var(--border-strong); border-radius: var(--radius-sm); }
      .cal-cell { min-height: 56px; }
      .detail-cards { grid-template-columns: 1fr; }
    }
    @media (max-width: 540px) {
      .cal-cell { min-height: 72px; padding: 8px 8px 6px; }
      .cal-day-num { font-size: 13px; }
      .cal-chip { display: block; }
      .content { padding: 1rem; }
      header { padding: 1.5rem 1rem 1.25rem; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="header-badge"><span class="header-badge-dot"></span>Mid Term Examinations</div>
    <h1>MIT Manipal — V Semester</h1>
    <p class="subtitle"><strong>B.Tech Mid Term Timetable</strong> &nbsp;·&nbsp; September 2026 &nbsp;·&nbsp; All exams at <strong>2:15 PM – 3:45 PM</strong></p>
  </header>

  <div class="app-shell" id="appShell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <button class="sidebar-toggle" id="sidebarToggle" title="Collapse filters" aria-expanded="true" aria-controls="branchList">
        <svg id="toggleIcon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 14l6-6 6 6" />
        </svg>
        <span class="sidebar-toggle-text">Filters</span>
        <span class="sidebar-toggle-hint" id="sidebarToggleHint">Tap to collapse</span>
      </button>
      <div class="sidebar-label">Select Branches</div>
      <input class="branch-search" type="text" id="branchSearch" placeholder="Search branch…" autocomplete="off" />
      <div class="branch-actions">
        <button class="btn-sm" id="btnSelectAll">Select All</button>
        <button class="btn-sm" id="btnClearAll">Clear All</button>
      </div>
      <div class="branch-list" id="branchList"></div>
    </aside>

    <!-- Main content -->
    <section class="content">
      <!-- Resources banner (shown only when a computing branch is selected) -->
      <div id="bannerContainer" class="banner-grid"></div>

      <div class="cal-header">
        <h2 class="cal-month-title">September 2026</h2>
        <div class="cal-legend">
          <div class="cal-legend-item">

let selectedBranches = new Set();
let activeDate = null;
let searchQuery = '';

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function isoFor(day) { return `2026-09-${String(day).padStart(2,'0')}`; }

function examsForDate(iso) {
  return EXAMS.filter(e => e[0] === iso);
}

function selectedExamsForDate(iso) {
  return EXAMS.filter(e => e[0] === iso && (selectedBranches.size === 0 || selectedBranches.has(e[1])));
}

function getBranch(id) { return BRANCHES.find(b => b.id === id); }

function formatDateLong(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

// September 2026 starts on Tuesday (index 1 in a Monday-based week).
// The timetable also includes open electives on October 1.
const CALENDAR_OFFSET = 1;
const CALENDAR_DATES = [
  ...Array.from({ length: 30 }, (_, index) => isoFor(index + 1)),
  '2026-10-01',
];

// ─── RENDER SIDEBAR ──────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('branchList');
  const q = searchQuery.toLowerCase();
  const filtered = BRANCHES.filter(b =>
    b.name.toLowerCase().includes(q) || b.code.includes(q) || b.abbr.toLowerCase().includes(q)
  );

  list.innerHTML = filtered.map(b => {
    const cnt = EXAMS.filter(e => e[1] === b.id).length;
    const sel = selectedBranches.has(b.id);
    return `
      <div class="branch-item ${sel?'selected':''}" data-id="${b.id}">
        <div class="bcheck">
          <svg width="8" height="6" fill="none" viewBox="0 0 8 6">
            <path d="M1 3L3 5.5L7 1" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="binfo">
        <div class="bcode">${b.code ? b.code + ' · ' : ''}${b.abbr}</div>
          <div class="bname">${b.name}</div>
        </div>
        <span class="bcount">${cnt}</span>
      </div>`;
  }).join('');

  list.querySelectorAll('.branch-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      selectedBranches.has(id) ? selectedBranches.delete(id) : selectedBranches.add(id);
      renderAll();
    });
  });
}

const EVENTS = {};

// ─── RENDER CALENDAR ─────────────────────────────────────────────────────────
function renderCalendar() {
  const grid = document.getElementById('calGrid');
  const cells = [];

  // Leading filler cells before September 1.
  for (let i = 0; i < CALENDAR_OFFSET; i++) {
    cells.push(`<div class="cal-cell filler"></div>`);
  }

  for (let index = 0; index < CALENDAR_DATES.length; index++) {
    const iso = CALENDAR_DATES[index];
    const day = new Date(iso + 'T00:00:00').getDate();
    const isExamDay = EXAM_DATES.has(iso);
    const allExams = isExamDay ? examsForDate(iso) : [];
    const selExams = isExamDay ? selectedExamsForDate(iso) : [];
    const hasSelected = selExams.length > 0;
    const isActive = iso === activeDate;

    const colIdx = (CALENDAR_OFFSET + index) % 7;
    const isWeekend = colIdx === 5 || colIdx === 6;

    // When a branch filter is active and this exam day has no matching exam → no-match
    const filterActive = selectedBranches.size > 0;
    const isNoMatch = isExamDay && filterActive && !hasSelected;

    const eventInfo = EVENTS[iso];
    const isEventDay = !!eventInfo;

    let cls = 'cal-cell';
    if (isExamDay) {
      if (hasSelected) {
        cls += ' exam-day has-selected';
      } else if (isNoMatch) {
        cls += ' exam-day no-match';
      } else {
        cls += ' exam-day';
      }
    } else if (isEventDay) {
      cls += ' event-day';
    } else {
      cls += ' regular';
    }
    if (isWeekend) cls += ' weekend';
    if (isActive) cls += ' active';

    const dayLabel = iso === '2026-10-01' ? 'Oct 1' : day;
    let inner = `<div class="cal-day-num">${dayLabel}</div>`;

    if (isExamDay) {
      if (hasSelected) {
        const first = selExams[0];
        inner += `<div class="cal-chip">${first[3]}</div>`;
        if (selExams.length > 1) {
          inner += `<div class="cal-count-label">+${selExams.length - 1} more</div>`;
        }
      } else if (!filterActive) {
        inner += `<div class="cal-count-label">${allExams.length} exam${allExams.length>1?'s':''}</div>`;
      }
    } else if (isEventDay) {
      inner += `<div class="cal-event-tag">&#x25CF; ${eventInfo.round}</div>`;
      inner += `<div class="cal-event-label">${eventInfo.label}${eventInfo.tentative ? '<br><span style="opacity:0.6">(Tentative)</span>' : ''}</div>`;
    }

    // no-match cells and event cells are not clickable as exam days
    const isClickable = isExamDay && !isNoMatch;
    cells.push(`<div class="${cls}" data-date="${isClickable ? iso : ''}" data-exam="${isClickable}">${inner}</div>`);
  }

  // Trailing fillers to complete the final calendar row.
  const total = CALENDAR_OFFSET + CALENDAR_DATES.length;
  const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 0; i < trailing; i++) {
    cells.push(`<div class="cal-cell filler"></div>`);
  }

  grid.innerHTML = cells.join('');

  grid.querySelectorAll('.cal-cell[data-exam="true"]').forEach(el => {
    el.addEventListener('click', () => {
      const date = el.dataset.date;
      if (!date) return;
      activeDate = activeDate === date ? null : date;
      renderAll();
      if (activeDate) {
        setTimeout(() => {
          document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 40);
      }
    });
  });
}

// ─── RENDER DETAIL ───────────────────────────────────────────────────────────
function renderDetail() {
  const panel = document.getElementById('detailPanel');
  if (!activeDate) { panel.innerHTML = ''; return; }

  const all = examsForDate(activeDate);
  const sel = selectedExamsForDate(activeDate);
  const show = sel.length > 0 ? sel : all;
  const label = (sel.length > 0 && selectedBranches.size > 0)
    ? `${show.length} exam${show.length>1?'s':''} for selected branch${selectedBranches.size>1?'es':''}`
    : `${show.length} exam${show.length>1?'s':''} scheduled across all branches`;

  const cards = show.map(e => {
    const b = getBranch(e[1]);
    return `
      <div class="dcard">
        <div class="dcard-branch">
          <span>${b ? b.code + ' · ' + b.abbr : e[1]}</span>
          <span style="color:var(--text-muted);font-weight:400">${b ? b.name : ''}</span>
        </div>
        <div class="dcard-code">${e[2]}</div>
        <div class="dcard-name">${e[3]}</div>
      </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="detail-panel">
      <div class="detail-top">
        <div>
          <div class="detail-date-big">${formatDateLong(activeDate)}</div>
          <div class="detail-sub">
            <span>${label}</span>
            <span>·</span>
            <span class="time-chip">
              <svg width="10" height="10" fill="none" viewBox="0 0 12 12">
                <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/>
                <path d="M6 3.5V6.5L7.5 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              2:15 PM – 3:45 PM
            </span>
          </div>
        </div>
        <button class="detail-close" id="detailCloseBtn">✕ Close</button>
      </div>
      <div class="detail-cards">${cards}</div>
    </div>`;

  document.getElementById('detailCloseBtn').addEventListener('click', () => {
    activeDate = null;
    renderAll();
  });
}

// ─── INIT ────────────────────────────────────────────────────────────────────
const appShell = document.getElementById('appShell');
const sidebarToggle = document.getElementById('sidebarToggle');
const toggleIcon = document.getElementById('toggleIcon');
const sidebarToggleHint = document.getElementById('sidebarToggleHint');

// Default to collapsed on mobile if user has not chosen a preference yet.
const savedSidebarState = localStorage.getItem('sidebarCollapsed');
const initialCollapsed = savedSidebarState === null
  ? window.matchMedia('(max-width: 860px)').matches
  : savedSidebarState === 'true';

appShell.classList.toggle('sidebar-collapsed', initialCollapsed);
updateToggleState(initialCollapsed);

sidebarToggle.addEventListener('click', () => {
  const isCollapsed = appShell.classList.toggle('sidebar-collapsed');
  localStorage.setItem('sidebarCollapsed', isCollapsed);
  updateToggleState(isCollapsed);
});

function updateToggleState(isCollapsed) {
  const isExpanded = !isCollapsed;
  sidebarToggle.setAttribute('aria-expanded', String(isExpanded));
  sidebarToggle.title = isExpanded ? 'Collapse filters' : 'Expand filters';
  if (sidebarToggleHint) {
    sidebarToggleHint.textContent = isExpanded ? 'Tap to collapse' : 'Tap to expand';
  }
  toggleIcon.innerHTML = isExpanded
    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 14l6-6 6 6" />'
    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 10l6 6 6-6" />';
}

document.getElementById('branchSearch').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderSidebar();
});

document.getElementById('btnSelectAll').addEventListener('click', () => {
  BRANCHES.forEach(b => selectedBranches.add(b.id));
  renderAll();
});

document.getElementById('btnClearAll').addEventListener('click', () => {
  selectedBranches.clear();
  activeDate = null;
  renderAll();
